name: .NET gateway CI
on:
  pull_request:
    paths: ["src/**", "schemas/**", "tests/**", "deploy/dotnet/**", "Directory.Build.props", "IoT.sln", ".dockerignore", ".github/workflows/dotnet-*.yml"]
  push:
    branches: [main, feature/dotnet-qbee]
    paths: ["src/**", "schemas/**", "tests/**", "deploy/dotnet/**", "Directory.Build.props", "IoT.sln", ".dockerignore", ".github/workflows/dotnet-*.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '8.0.x'}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: dotnet build IoT.sln -c Release --nologo
      # IoT.Checks is an executable, not a dotnet test project.
      - run: dotnet tests/IoT.Checks/bin/Release/net8.0/IoT.Checks.dll
        env: {HISTORIAN_TEST_CONNECTION: ''}
      - run: node --test tests/deployment/qbee.test.cjs
      - name: Browser registry checks
        run: |
          dotnet publish src/EdgeGateway/EdgeGateway.Configuration -c Release -o logs/dotnet-qbee/browser-app
          npm ci --prefix tests/deployment --no-audit --no-fund
          cd tests/deployment
          npx playwright install --with-deps chromium
          npm test
      - name: Build edge images
        run: |
          for target in gateway configuration broker certs simulator; do
            docker build -f deploy/dotnet/Dockerfile --target "$target" -t "iot-dotnet-$target:local" .
          done
      - name: Edge stack integration checks
        run: node --test tests/deployment/stack.test.cjs
      - uses: docker/setup-qemu-action@v4
      - name: ARM64 images and integration checks
        run: |
          for target in gateway configuration broker certs simulator; do
            docker build --platform linux/arm64 -f deploy/dotnet/Dockerfile --target "$target" -t "iot-dotnet-$target:local-arm64" .
          done
          EDGE_TEST_PLATFORM=linux/arm64 EDGE_IMAGE_TAG=local-arm64 node --test tests/deployment/stack.test.cjs
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        target: [gateway, configuration, broker, certs, simulator]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/dotnet/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fission-tech/iot-dotnet-${{ matrix.target }}:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=dotnet-${{ matrix.target }}
          cache-to: type=gha,scope=dotnet-${{ matrix.target }},mode=max
      - name: Scan application images
        if: matrix.target == 'gateway' || matrix.target == 'configuration'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/fission-tech/iot-dotnet-${{ matrix.target }}:${{ steps.version.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  deploy-staging:
    needs: publish
    if: github.event_name == 'push' && vars.DOTNET_QBEE_GROUP_ID != ''
    uses: ./.github/workflows/dotnet-deploy.yml
    with:
      ref: ${{ github.sha }}
      simulator: true
    secrets: inherit
