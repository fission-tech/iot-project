name: .NET gateway deploy
on:
  workflow_call:
    inputs:
      ref: {type: string, required: true}
      simulator: {type: boolean, default: false}
      tag: {type: string, default: ''}
  workflow_dispatch:
    inputs:
      ref: {description: 'Commit containing the matching deployment files', type: string, required: true}
      tag: {description: 'Existing immutable image tag (blank uses sha-<full commit>)', type: string, default: ''}
      simulator: {description: 'Staging simulator (leave off for real equipment)', type: boolean, default: false}
permissions: {contents: read}
concurrency:
  group: dotnet-qbee-${{ vars.DOTNET_QBEE_GROUP_ID }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ inputs.ref }}'}
      - id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          ref="$(git rev-parse HEAD)"
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag="sha-$ref"; fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Not a valid image tag: $tag" >&2; exit 1
          fi
          { echo "ref=$ref"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "Deploy $tag (from $ref) to the configured .NET staging group"
  staging:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ needs.plan.outputs.ref }}'}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Deploy and wait for healthy edge computers
        env:
          DOTNET_QBEE_EMAIL: ${{ secrets.ILYAAN_QBEE_EMAIL }}
          DOTNET_QBEE_PASSWORD: ${{ secrets.ILYAAN_QBEE_PASSWORD }}
          DOTNET_GHCR_USERNAME: ${{ secrets.ILYAAN_GHCR_USERNAME }}
          DOTNET_GHCR_TOKEN: ${{ secrets.ILYAAN_GHCR_TOKEN }}
          GROUP: ${{ vars.DOTNET_QBEE_GROUP_ID }}
          TAG: ${{ needs.plan.outputs.tag }}
          SIMULATOR: ${{ inputs.simulator }}
          ZEROTIER: ${{ vars.DOTNET_QBEE_ZEROTIER }}
        shell: bash
        run: |
          if [ -z "$GROUP" ]; then echo "Set DOTNET_QBEE_GROUP_ID to the dedicated .NET group." >&2; exit 1; fi
          args=(--group "$GROUP" --tag "$TAG")
          if [ "$SIMULATOR" = "true" ]; then args+=(--simulator); fi
          if [ "$ZEROTIER" = "true" ]; then args+=(--zerotier); fi
          node deploy/dotnet/qbee-deploy.cjs "${args[@]}"
