# Rolls the Node-RED gateway out to edge devices through qbee.io.
#   called by Node-RED CI after it publishes the images of a push to test/qbee-ilyaan-setup -> Ilyaan's staging group
#   run by hand with a published tag                                                 -> staging (how to roll back)
# For now only staging is deployed; canary and production are commented out below until their groups exist.
# This test branch uses the repository variable ILYAAN_QBEE_GROUP_ID and repository secrets
# ILYAAN_QBEE_EMAIL, ILYAAN_QBEE_PASSWORD, ILYAAN_GHCR_USERNAME and ILYAAN_GHCR_TOKEN, with one gateway per VM.
name: Node-RED deploy

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit whose images were published"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy, for example sha-1a2b3c4 or v1.2.0"
        required: true

permissions:
  contents: read

# One rollout at a time; a newer one waits instead of cancelling a rollout in progress.
concurrency:
  group: nodered-deploy-ilyaan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - id: plan
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            # Called by CI: the image tag is the commit's short SHA, as docker/metadata-action writes it.
            ref="$INPUT_REF"; tag="sha-${INPUT_REF:0:7}"
          else
            tag="$INPUT_TAG"
            case "$tag" in
              v*) ref="nodered-$tag" ;;
              sha-*) ref="${tag#sha-}" ;;
              *) echo "Tag must look like sha-1a2b3c4 or v1.2.0" >&2; exit 1 ;;
            esac
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Not a valid image tag: $tag" >&2; exit 1
          fi
          { echo "tag=$tag"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"
          echo "Deploy $tag (from $ref) to staging"

  staging:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The deploy script and Compose file from the version being deployed, so a rollback uses its own.
      - name: Check out the deployed version
        env:
          REF: ${{ needs.plan.outputs.ref }}
        run: git checkout --detach "$REF"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Staging devices are VMs without Modbus devices, so each gateway gets the simulated plant next to it.
      - name: Deploy and wait for healthy devices
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GROUP: ${{ vars.ILYAAN_QBEE_GROUP_ID }}
          INSTANCES: '1'
          QBEE_EMAIL: ${{ secrets.ILYAAN_QBEE_EMAIL }}
          QBEE_PASSWORD: ${{ secrets.ILYAAN_QBEE_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.ILYAAN_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.ILYAAN_GHCR_TOKEN }}
        run: >-
          node nodered/deploy/qbee-deploy.js --group "$GROUP" --tag "$TAG"
          --instances "$INSTANCES" --simulator --wait-minutes 20

  # Canary and production: turned off until their qbee groups and GitHub environments exist. To turn them on,
  # uncomment both jobs, add the environments with required reviewers, and decide what triggers them (for example
  # a nodered-v* tag). Each waits for the previous environment to succeed.
