  #         QBEE_PASSWORD: ${{ secrets.QBEE_PASSWORD }}
  #         GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
  #         GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  #       run: node nodered/deploy/qbee-deploy.js --group "$GROUP" --tag "$TAG" --wait-minutes 30
