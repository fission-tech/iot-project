persistence true
persistence_location /mosquitto/data/
log_dest stdout
listener 8883
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
allow_anonymous false
# Written at start by broker-start.sh from MQTT_GATEWAY_PASSWORD and MQTT_VIEWER_PASSWORD.
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
