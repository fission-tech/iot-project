apiVersion: 1

providers:
  # Hand-made dashboards are files in the repo; edits made in the Grafana UI must be exported back to grafana/dashboards.
  - name: edge
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
  # One dashboard per device, written by the historian into grafana/generated/devices (not in Git).
  - name: devices
    type: file
    folder: Devices
    folderUid: devices
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/generated/devices
