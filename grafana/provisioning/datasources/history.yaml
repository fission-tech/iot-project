apiVersion: 1

datasources:
  - name: History
    uid: history
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${HISTORY_DB}
      sslmode: disable
      timescaledb: true
      postgresVersion: 1700
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
