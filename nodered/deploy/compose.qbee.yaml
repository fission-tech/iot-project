# The Node-RED gateway on an edge device, deployed by qbee.io as a Docker Compose project.
# qbee fills in each template parameter (a key in double braces) before running it; see deploy/README.md.
# Unlike ../compose.yaml, nothing is built here: the images come from GHCR, and the certificate is a volume.
# qbee-deploy.js --instances runs this file several times on one device, as projects iot-nodered, iot-nodered-2, ...
# Each has its own broker, state and ports; GATEWAY_INSTANCE appends its number to GATEWAY_ID.
# REMOTE_BIND is a second address the ports are published on: the device's ZeroTier IP with qbee-deploy.js --zerotier
# (staging only), otherwise 127.0.0.2, which like 127.0.0.1 is reachable from nowhere but the device itself.
services:
  # Creates the broker certificate on the first start, then exits. Later starts keep it.
  certs:
    image: ghcr.io/fission-tech/iot-nodered-certs:{{IMAGE_TAG}}
    volumes:
      - certs:/certs
    restart: "no"

  mosquitto:
    image: ghcr.io/fission-tech/iot-nodered-broker:{{IMAGE_TAG}}
    depends_on:
      certs:
        condition: service_completed_successfully
    # Only this device (and, on staging, ZeroTier members) can connect; reach it remotely through qbee-cli.
    ports:
      - "127.0.0.1:{{MQTT_PORT}}:8883"
      - "{{REMOTE_BIND}}:{{MQTT_PORT}}:8883"
    # Logins: the gateway publishes as "gateway"; people and dashboards read as "viewer". See docker/broker-start.sh.
    environment:
      MQTT_GATEWAY_PASSWORD: "{{MQTT_GATEWAY_PASSWORD}}"
      MQTT_VIEWER_PASSWORD: "{{MQTT_VIEWER_PASSWORD}}"
    volumes:
      - certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  nodered:
    image: ghcr.io/fission-tech/iot-nodered:{{IMAGE_TAG}}
    depends_on:
      certs:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    environment:
      GATEWAY_ID: "{{GATEWAY_ID}}"
      GATEWAY_INSTANCE: "{{GATEWAY_INSTANCE}}"
      NODE_RED_PASSWORD: "{{NODE_RED_PASSWORD}}"
      MQTT_USERNAME: gateway
      MQTT_PASSWORD: "{{MQTT_GATEWAY_PASSWORD}}"
    ports:
      - "127.0.0.1:{{NODE_RED_PORT}}:1880"
      - "{{REMOTE_BIND}}:{{NODE_RED_PORT}}:1880"
    volumes:
      - nodered-state:/data/state
      - certs:/certs:ro
    # Modbus devices on the device's own network are reached by their address, as usual.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Simulated plant for staging devices, which have no Modbus devices of their own. SIM_REPLICAS is 1 with
  # qbee-deploy.js --simulator and 0 otherwise, so a real device runs neither of these.
  # It reads Node-RED's registry and answers as every device registered at host modbus-sim, port 1502.
  modbus-sim:
    image: ghcr.io/fission-tech/iot-nodered-sim:{{IMAGE_TAG}}
    deploy:
      replicas: {{SIM_REPLICAS}}
    environment:
      NODE_RED_PASSWORD: "{{NODE_RED_PASSWORD}}"
    restart: unless-stopped

  # Registers the simulated pump and tank with Node-RED once, then exits. Devices that exist are left alone.
  sim-seed:
    image: ghcr.io/fission-tech/iot-nodered-sim:{{IMAGE_TAG}}
    command: ["node", "seed.js"]
    deploy:
      replicas: {{SIM_REPLICAS}}
    depends_on:
      nodered:
        condition: service_healthy
    environment:
      GATEWAY_ID: "{{GATEWAY_ID}}"
      GATEWAY_INSTANCE: "{{GATEWAY_INSTANCE}}"
      NODE_RED_PASSWORD: "{{NODE_RED_PASSWORD}}"
    restart: "no"

volumes:
  certs:
  mosquitto-data:
  nodered-state:
